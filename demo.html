<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>Disposable useful counter</title><h1>Counter — pilot test</h1><p>Count completed tasks. All values stay in this page.</p><button id="add">Add task</button><button id="reset">Reset</button><output id="count">0</output><script>let n=0;document.querySelector('#add').onclick=()=>{document.querySelector('#count').textContent=++n;};document.querySelector('#reset').onclick=()=>{n=0;document.querySelector('#count').textContent=n;};</script></html>
